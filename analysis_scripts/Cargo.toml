[package]
name = "mad_simulations"
version = "0.1.0"
edition = "2021"
description = "Resample every population, then compute MAD (minimum number of alleles whose cumulative allele frequency first exceeds a cutoff)."

[[bin]]
name = "mad_simulations"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
